<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profiler</title>
    <!-- css -->
  </head>
  <body>
    <div class="editor">
      <div class="titlebar">
        <div class="titlebar-tab active" data-view="flame-graph" style="border-left: none">
          <p class="titlebar-tab-text">Flame Graph</p>
        </div>
        <div class="titlebar-tab" data-view="calltree">
          <p class="titlebar-tab-text">Call Tree</p>
        </div>
        <div class="titlebar-tab" data-view="methods">
          <p class="titlebar-tab-text">Method List</p>
        </div>
        <div class="titlebar-tab-fill"></div>
      </div>
      <div id="main" style="display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <label class="input-label" for="load-vscprof">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 99.09 122.88">
            <path d="M64.64,13,86.77,36.21H64.64V13ZM42.58,71.67a3.25,3.25,0,0,1-4.92-4.25l9.42-10.91a3.26,3.26,0,0,1,4.59-.33,5.14,5.14,0,0,1,.4.41l9.3,10.28a3.24,3.24,0,0,1-4.81,4.35L52.8,67.07V82.52a3.26,3.26,0,1,1-6.52,0V67.38l-3.7,4.29ZM24.22,85.42a3.26,3.26,0,1,1,6.52,0v7.46H68.36V85.42a3.26,3.26,0,1,1,6.51,0V96.14a3.26,3.26,0,0,1-3.26,3.26H27.48a3.26,3.26,0,0,1-3.26-3.26V85.42ZM99.08,39.19c.15-.57-1.18-2.07-2.68-3.56L63.8,1.36A3.63,3.63,0,0,0,61,0H6.62A6.62,6.62,0,0,0,0,6.62V116.26a6.62,6.62,0,0,0,6.62,6.62H92.46a6.62,6.62,0,0,0,6.62-6.62V39.19Zm-7.4,4.42v71.87H7.4V7.37H57.25V39.9A3.71,3.71,0,0,0,61,43.61Z"/>
          </svg>
          Open Previous Profiler Session
        </label>
        <input class="input-file" type="file" id="load-vscprof" accept=".vscprof"/>
      </div>
    </div>
    <div class="tooltip">
      <div class="tooltip-time tooltip-fire">
        <p id="function-name" class="tooltip-function"></p>
        <div style="flex-grow: 1"></div>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" id="fire-icon" viewBox="0 0 16 16">
          <path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15"/>
        </svg>
        <p id="value-count-label"></p>
      </div>
      <div class="tooltip-data">
        <p id="absolute-percentage-label" class="tooltip-percentage"></p>
        <p>of all</p>
        <div></div>
        <div></div>
        <p id="relative-percentage-label" class="tooltip-percentage"></p>
        <p>of</p>
        <p id="parent-name" class="tooltip-function"></p>
      </div>
    </div>
    <!-- js -->
  </body>
</html>
